name: CI

on:
  push:
    branches:
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and contract tests / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout MySQL adapter
        uses: actions/checkout@v7
        with:
          path: mysql-adapter

      - name: Checkout base adapter v2
        uses: actions/checkout@v7
        with:
          repository: toshihikojs/base-adapter
          ref: v2
          path: base-adapter

      - name: Checkout Toshihiko v2
        uses: actions/checkout@v7
        with:
          repository: toshihikojs/Toshihiko
          ref: v2
          path: Toshihiko

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mysql-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: mysql-adapter

      - name: Validate dependency tree
        run: npm run validate
        working-directory: mysql-adapter

      - name: Build and test
        run: npm test
        working-directory: mysql-adapter

  mysql-integration:
    name: MySQL integration / ${{ matrix.mysql-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:5.7
          - mysql:8.4

    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_ROOT_PASSWORD: toshihiko
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -ptoshihiko"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout MySQL adapter
        uses: actions/checkout@v7
        with:
          path: mysql-adapter

      - name: Checkout base adapter v2
        uses: actions/checkout@v7
        with:
          repository: toshihikojs/base-adapter
          ref: v2
          path: base-adapter

      - name: Checkout Toshihiko v2
        uses: actions/checkout@v7
        with:
          repository: toshihikojs/Toshihiko
          ref: v2
          path: Toshihiko

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mysql-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: mysql-adapter

      - name: Build package
        run: npm run build
        working-directory: mysql-adapter

      - name: Run MySQL integration tests
        run: npm run test:integration
        working-directory: mysql-adapter
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PASSWORD: toshihiko
          MYSQL_PORT: 3306
          MYSQL_USER: root
