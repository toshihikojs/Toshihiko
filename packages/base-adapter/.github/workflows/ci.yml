name: CI

on:
  push:
    branches:
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and contract tests / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout base adapter
        uses: actions/checkout@v7
        with:
          path: base-adapter

      - name: Checkout Toshihiko v2
        uses: actions/checkout@v7
        with:
          repository: toshihikojs/Toshihiko
          ref: v2
          path: Toshihiko

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: base-adapter/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: base-adapter

      - name: Validate dependency tree
        run: npm run validate
        working-directory: base-adapter

      - name: Build and test
        run: npm test
        working-directory: base-adapter
