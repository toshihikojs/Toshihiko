name: CI

on:
  push:
    branches:
      - v2
      - monorepo/v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      - name: Validate dependency versions
        run: rush check

      - name: Build packages
        run: rush build --verbose

      - name: Type-check packages
        run: rush typecheck --verbose

      - name: Run package tests
        run: rush test --verbose

  coverage:
    name: Package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      - name: Generate package coverage
        run: rush test:coverage --verbose

      - name: Normalize package coverage paths
        run: node scripts/normalize-lcov-paths.cjs

      - name: Build coverage site
        run: node scripts/build-coverage-site.cjs

      - name: Archive package coverage
        uses: actions/upload-artifact@v4
        with:
          name: package-coverage
          path: common/temp/coverage-site
          retention-days: 14

      - name: Upload coverage site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v2'
        uses: actions/upload-pages-artifact@v4
        with:
          path: common/temp/coverage-site

  deploy-coverage:
    name: Publish coverage report
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v2'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy coverage site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  mysql-integration:
    name: MySQL and cache integration / ${{ matrix.mysql-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:5.7
          - mysql:8.4

    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_ROOT_PASSWORD: toshihiko
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -ptoshihiko"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      memcached:
        image: memcached:1.6.29-alpine
        ports:
          - 11211:11211

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      - name: Build service-backed packages
        run: rush build --verbose

      - name: Run MySQL and cache integration tests
        run: |
          set +e
          rush test:integration --verbose > integration.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            node -e 'const fs = require("node:fs"); const output = fs.readFileSync("integration.log", "utf8"); const failures = output.split("\n").filter((line) => /^\s*not ok\b/.test(line)).map((line) => line.trim()).slice(-20); const locations = [...new Set(output.match(/\.test-dist\/integration\/[^)\s]+:\d+:\d+/g) || [])].slice(-20); const summary = [...failures, ...locations].join("; ") || "Integration command failed without a named test failure."; console.log(`::error title=Service integration failure::${summary}`);'
          fi
          exit "$status"
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PASSWORD: toshihiko
          MYSQL_PORT: 3306
          MYSQL_USER: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MEMCACHED_HOST: 127.0.0.1
          MEMCACHED_PORT: 11211
