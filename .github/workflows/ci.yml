name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      # npm 6 only records the optional Rollup binary for the platform where
      # the shrinkwrap was generated. Install the matching Linux binary for
      # the CI runner without changing the repository lockfile.
      - name: Install Rollup binary for Linux
        working-directory: common/temp
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Validate dependency versions
        run: rush check

      - name: Build packages
        run: rush build --verbose

      - name: Type-check packages
        run: rush typecheck --verbose

      - name: Run package tests
        run: rush test --verbose

  coverage:
    name: Package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      - name: Generate package coverage
        run: rush test:coverage --verbose

      - name: Normalize package coverage paths
        run: node scripts/normalize-lcov-paths.cjs

      - name: Upload to Codecov / toshihiko
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/toshihiko/coverage/lcov.info
          flags: toshihiko
          name: toshihiko
          use_oidc: true

      - name: Upload to Codecov / base-adapter
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/base-adapter/coverage/lcov.info
          flags: base-adapter
          name: base-adapter
          use_oidc: true

      - name: Upload to Codecov / mysql-adapter
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/mysql-adapter/coverage/lcov.info
          flags: mysql-adapter
          name: mysql-adapter
          use_oidc: true

      - name: Upload to Codecov / base-cache
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/base-cache/coverage/lcov.info
          flags: base-cache
          name: base-cache
          use_oidc: true

      - name: Upload to Codecov / redis-cache
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/redis/coverage/lcov.info
          flags: redis-cache
          name: redis-cache
          use_oidc: true

      - name: Upload to Codecov / memcached-cache
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/memcached/coverage/lcov.info
          flags: memcached-cache
          name: memcached-cache
          use_oidc: true

      - name: Upload to Codecov / sql-utils
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/sql-utils/coverage/lcov.info
          flags: sql-utils
          name: sql-utils
          use_oidc: true

  mysql-integration:
    name: MySQL and cache integration / ${{ matrix.mysql-image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:5.7
          - mysql:8.4

    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_ROOT_PASSWORD: toshihiko
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -ptoshihiko"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      memcached:
        image: memcached:1.6.29-alpine
        ports:
          - 11211:11211

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      - name: Build service-backed packages
        run: >-
          rush build
          --to @toshihiko/mysql-adapter
          --to @toshihiko/redis-cache
          --to @toshihiko/memcached-cache
          --verbose

      - name: Run MySQL and cache integration tests
        run: |
          set +e
          rush test:integration --verbose > integration.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            node -e 'const fs = require("node:fs"); const output = fs.readFileSync("integration.log", "utf8"); const failures = output.split("\n").filter((line) => /^\s*not ok\b/.test(line)).map((line) => line.trim()).slice(-20); const locations = [...new Set(output.match(/\.test-dist\/integration\/[^)\s]+:\d+:\d+/g) || [])].slice(-20); const summary = [...failures, ...locations].join("; ") || "Integration command failed without a named test failure."; console.log(`::error title=Service integration failure::${summary}`);'
          fi
          exit "$status"
        env:
          MYSQL_DATABASE: toshihiko_test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PASSWORD: toshihiko
          MYSQL_PORT: 3306
          MYSQL_USER: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MEMCACHED_HOST: 127.0.0.1
          MEMCACHED_PORT: 11211
