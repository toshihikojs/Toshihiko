name: Documentation

on:
  push:
    branches:
      - v2
    paths:
      - '.github/workflows/docs.yml'
      - 'common/**'
      - 'docs/**'
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'packages/*/tsconfig*.json'
      - 'rush.json'
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'common/**'
      - 'docs/**'
      - 'packages/*/package.json'
      - 'packages/*/src/**'
      - 'packages/*/tsconfig*.json'
      - 'rush.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rush
        run: npm install --global @microsoft/rush@5.172.1

      - name: Install dependencies
        run: rush install

      # npm 6 only records the optional Rollup binary for the platform where
      # the shrinkwrap was generated. Install the matching Linux binary for
      # the Pages runner without changing the repository lockfile.
      - name: Install Rollup binary for Linux
        working-directory: common/temp
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Build API packages
        run: >-
          rush build
          --to @toshihiko/mysql-adapter
          --to @toshihiko/redis-cache
          --to @toshihiko/memcached-cache
          --verbose

      - name: Build documentation
        run: rush build --to @toshihiko/docs --verbose

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
